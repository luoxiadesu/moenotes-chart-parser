name: C API and Packaging

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        include:
          - cc: gcc
            cxx: g++
            flags: ""
          - cc: clang
            cxx: clang++
            flags: "-fsanitize=address,undefined -fno-omit-frame-pointer"
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        run: sudo apt-get update && sudo apt-get install -y zlib1g-dev
      - name: Configure
        run: >-
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_C_FLAGS="${{ matrix.flags }}"
      - name: Build
        run: cmake --build build --parallel 2
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Install
        run: cmake --install build --prefix "$PWD/build/install"
      - name: Configure Installed Consumers
        run: >-
          cmake -S tests/consumer -B build/consumer
          -DCMAKE_PREFIX_PATH="$PWD/build/install"
          -DCMAKE_C_FLAGS="${{ matrix.flags }}"
          -DCMAKE_CXX_FLAGS="${{ matrix.flags }}"
      - name: Build Installed Consumers
        run: cmake --build build/consumer --parallel 2
      - name: Test Installed Consumers
        run: ctest --test-dir build/consumer --output-on-failure
